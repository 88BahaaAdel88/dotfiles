unbind r
bind r source-file ~/.tmux.conf

# set-option -g prefix C-a

set -g mouse on

# Mouse selection & copy behavior
# Do not cancel copy-mode / jump down on mouse release
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode    MouseDragEnd1Pane

# Stay in copy mode when copying with Enter or y
bind -T copy-mode-vi Enter send-keys -X copy-pipe
bind -T copy-mode-vi y     send-keys -X copy-pipe
bind -T copy-mode    Enter send-keys -X copy-pipe
# move between tmux panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# setw -g automatic-rename off
# setw -g allow-rename on
set -g automatic-rename on
set -g allow-rename off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
#set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @continuum-restore 'on'

## Catppuccin Setup
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Optional: set status bar background ("default", "none" for transparent, or a hex color)
set -g @catppuccin_status_background "default"

## Status Bar Customization
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

## Resurrect & Continuum Options
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TMUX plugin manager (keep this at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
