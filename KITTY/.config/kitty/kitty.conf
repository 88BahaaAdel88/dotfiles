# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5

shell zsh

# Cursor
cursor           #f5e0dc
cursor_text_color #1e1e2e
cursor_shape     beam
cursor_blink     on

# Color scheme (Catppuccin Mocha)
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

url_color               #f5e0dc

# Borders
active_border_color     #cba6f7
inactive_border_color   #45475a
bell_border_color       #fab387

# Tab bar
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# The 16 terminal colors
# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# Window padding
window_padding_width 8

# Scrollback
scrollback_lines 10000

# Clipboard control
copy_on_select yes

# Enable ligatures
enable_ligatures always

# Disable bell
enable_audio_bell no

# Kitty tweaks
confirm_os_window_close 0
remember_window_size no
initial_window_width  850
initial_window_height 550
