source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# BACKGROUND (Blurred Screenshot)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.90
    brightness = 0.75
    color = $base
}

# TIME (Centered Android/Pixel Header)
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 76
    font_family = $font
    position = 0, -75
    halign = center
    valign = top
}

# DATE
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $subtext0
    font_size = 17
    font_family = $font
    position = 0, -210
    halign = center
    valign = top
}

# AT A GLANCE (WEATHER & PRAYER)
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/glance.sh
    color = $text
    font_size = 13
    font_family = $font
    position = 0, -255
    halign = center
    valign = top
}

# ANDROID-STYLE NOTIFICATION ICONS (App icons + badges, private)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/notifications.sh
    color = $text
    font_size = 18
    font_family = $font
    position = 0, -300
    halign = center
    valign = top
}

# GREETING
label {
    monitor =
    text = cmd[update:60000] echo "Good $(date +%H | awk '{if ($1 < 12) print "morning"; else if ($1 < 18) print "afternoon"; else print "evening"}'), $USER"
    color = $subtext0
    font_size = 16
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -25
    halign = center
    valign = center
}

# CAPS LOCK INDICATOR
label {
    monitor =
    text = cmd[update:200] ~/.config/hypr/scripts/capslock.sh
    color = $yellow
    font_size = 14
    font_family = $font
    position = 0, -68
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = rgba(205, 214, 244, 0.7)
    font_size = 13
    font_family = $font
    position = 35, 25
    halign = left
    valign = bottom
}

# MEDIA PLAYER - TRACK INFO & PROGRESS
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/media.sh info
    color = $text
    font_size = 12
    font_family = $font
    position = 0, 65
    halign = center
    valign = bottom
    text_align = center
}

# MEDIA PLAYER - PREVIOUS
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/media.sh prev
    color = $accent
    font_size = 18
    font_family = $font
    position = -45, 25
    halign = center
    valign = bottom
    onclick = playerctl previous
}

# MEDIA PLAYER - PLAY / PAUSE
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/media.sh play
    color = $accent
    font_size = 20
    font_family = $font
    position = 0, 25
    halign = center
    valign = bottom
    onclick = playerctl play-pause
}

# MEDIA PLAYER - NEXT
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/media.sh next
    color = $accent
    font_size = 18
    font_family = $font
    position = 45, 25
    halign = center
    valign = bottom
    onclick = playerctl next
}

# BATTERY
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery.sh
    color = rgba(205, 214, 244, 0.7)
    font_size = 13
    font_family = $font
    position = -35, 25
    halign = right
    valign = bottom
}
