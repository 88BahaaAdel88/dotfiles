################
### MONITORS ###
################

# Main laptop display at origin (0x0)
monitor = eDP-1, preferred, 0x0, 1

# Current external monitor matched by hardware EDID description
# Placed to the left of the laptop regardless of changing port names (DP-1, DP-2, etc.)
monitor = desc:Samsung Electric Company SMS22A450, preferred, auto-left, 1

# Fallback for all other connected displays (places to the right of the laptop)
monitor = , preferred, auto-right, 1

##################
### WORKSPACES ###
##################

# First 6 workspaces belong to Samsung monitor when connected
workspace = 1, monitor:desc:Samsung Electric Company SMS22A450, default:true
workspace = 2, monitor:desc:Samsung Electric Company SMS22A450
workspace = 3, monitor:desc:Samsung Electric Company SMS22A450
workspace = 4, monitor:desc:Samsung Electric Company SMS22A450
workspace = 5, monitor:desc:Samsung Electric Company SMS22A450
workspace = 6, monitor:desc:Samsung Electric Company SMS22A450

# Remaining workspaces belong to the laptop display
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

