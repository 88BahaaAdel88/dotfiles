################
### MONITORS ###
################

# Main laptop display at origin (0x0)
monitor = eDP-1, preferred, 0x0, 1

# Match external monitor by hardware EDID description
# This automatically handles port alternating between DP-1 and DP-2
monitor = desc:Samsung Electric Company SMS22A450 HMACC00079, preferred, auto-left, 1

# Fallback port rules for DP-1 and DP-2
monitor = DP-1, preferred, auto-left, 1
monitor = DP-2, preferred, auto-left, 1

# Fallback for any other connected display (places to the left of laptop)
monitor = , preferred, auto-right, 1
